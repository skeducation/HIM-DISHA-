name: Deploy HIM DISHA to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh batch API snapshot
        run: |
          mkdir -p public
          node --input-type=module <<'NODE'
          const fs = await import("node:fs/promises");
          const urls = [
            "https://hrrydoc.vercel.app/api/disha/batches",
            "https://skeducation.github.io/HIM-DISHA-/disha-batches.json"
          ];
          let saved = false;
          let errors = [];
          for (const url of urls) {
            try {
              const response = await fetch(url, { headers: { accept: "application/json" }, signal: AbortSignal.timeout(20000), cache: "no-store" });
              if (!response.ok) throw new Error("HTTP " + response.status);
              const json = await response.json();
              const rows = Array.isArray(json) ? json : Array.isArray(json?.data) ? json.data : Array.isArray(json?.batches) ? json.batches : [];
              if (!rows.length) throw new Error("No batch records in response");
              await fs.writeFile("public/disha-batches.json", JSON.stringify({ success: true, data: rows }));
              console.log("Saved " + rows.length + " batches from " + url);
              saved = true;
              break;
            } catch (error) {
              errors.push(url + ": " + error.message);
              console.warn("Batch source unavailable:", url, error.message);
            }
          }
          if (!saved) {
            try {
              await fs.access("public/disha-batches.json");
              console.warn("Keeping checked-out batch snapshot as fallback.");
              saved = true;
            } catch {}
          }
          if (!saved) throw new Error("No batch snapshot available. " + errors.join(" | "));
          NODE
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build full batch content snapshot
        run: node scripts/build-disha-content.mjs
      - name: Install dependencies
        run: npm install
      - name: Build website
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
