name: Deploy HIM DISHA to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh batch API snapshot
        run: |
          mkdir -p public
          node --input-type=module <<'NODE'
          const fs = await import("node:fs/promises");
          const urls = [
            "https://hrrydoc.vercel.app/api/disha/batches",
            "https://skeducation.github.io/HIM-DISHA-/disha-batches.json"
          ];
          let saved = false;
          let errors = [];
          for (const url of urls) {
            try {
              const response = await fetch(url, { headers: { accept: "application/json" }, signal: AbortSignal.timeout(20000), cache: "no-store" });
              if (!response.ok) throw new Error("HTTP " + response.status);
              const json = await response.json();
              const rows = Array.isArray(json) ? json : Array.isArray(json?.data) ? json.data : Array.isArray(json?.batches) ? json.batches : [];
              if (!rows.length) throw new Error("No batch records in response");
              await fs.writeFile("public/disha-batches.json", JSON.stringify({ success: true, data: rows }));
              console.log("Saved " + rows.length + " batches from " + url);
              saved = true;
              break;
            } catch (error) {
              errors.push(url + ": " + error.message);
              console.warn("Batch source unavailable:", url, error.message);
            }
          }
          if (!saved) {
            try {
              await fs.access("public/disha-batches.json");
              console.warn("Keeping checked-out batch snapshot as fallback.");
              saved = true;
            } catch {}
          }
          if (!saved) throw new Error("No batch snapshot available. " + errors.join(" | "));
          NODE
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore last published study content snapshot
        run: |
          node --input-type=module <<'NODE'
          const fs = await import("node:fs/promises");
          try {
            const response = await fetch("https://skeducation.github.io/HIM-DISHA-/disha-content.json", {
              headers: { accept: "application/json" },
              signal: AbortSignal.timeout(15000),
              cache: "no-store"
            });
            if (!response.ok) throw new Error("HTTP " + response.status);
            const json = await response.json();
            const batches = json?.batches && typeof json.batches === "object" ? json.batches : {};
            const totals = Object.values(batches).reduce((sum, batch) => {
              sum.subjects += (batch.subjects || []).length;
              sum.videos += batch.totals?.videos || 0;
              sum.pdfs += batch.totals?.pdfs || 0;
              return sum;
            }, { subjects: 0, videos: 0, pdfs: 0 });
            if (!Object.keys(batches).length || !Object.values(totals).some(Boolean)) {
              throw new Error("Published snapshot contains no original study content");
            }
            await fs.writeFile("public/disha-content.json", JSON.stringify({ ...json, batches, totals }));
            console.log("Restored previous published snapshot:", JSON.stringify(totals));
          } catch (error) {
            console.warn("No previous published snapshot restored; fresh API build will continue:", error.message);
          }
          NODE
      - name: Build original study content snapshot
        timeout-minutes: 45
        continue-on-error: true
        run: node scripts/build-disha-content.mjs
      - name: Install dependencies
        run: npm install
      - name: Build website
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
