name: Deploy HIM DISHA to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Refresh batch API snapshot
        continue-on-error: true
        run: |
          mkdir -p public
          node --input-type=module <<'NODE'
          const url = "https://hrrydoc.vercel.app/api/disha/batches";
          try {
            const response = await fetch(url, { headers: { accept: "application/json" } });
            if (!response.ok) throw new Error("HTTP " + response.status);
            const json = await response.json();
            const rows = Array.isArray(json) ? json : json?.data;
            if (!Array.isArray(rows) || !rows.length) throw new Error("No batch records in API response");
            await (await import("node:fs/promises")).writeFile("public/disha-batches.json", JSON.stringify({ success: true, data: rows }));
            console.log("Saved " + rows.length + " batches for same-origin loading.");
          } catch (error) {
            console.error("Batch snapshot refresh failed:", error.message);
            process.exitCode = 1;
          }
          NODE
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build full batch content snapshot
        run: node scripts/build-disha-content.mjs
      - name: Install dependencies
        run: npm install
      - name: Build website
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
